[network]
hr_feed_url = "https://gist.githubusercontent.com/dummy/raw/hr_feed.csv"
timeout_seconds = 10
ca_bundle_path = ""
max_response_mb = 10
max_retries = 3

[database]
path = ""
wal_mode = true
busy_timeout_ms = 5000

[policy]
orphan_severity = "CRITICAL"
missing_severity = "MEDIUM"
drift_severity = "HIGH"

[source]
max_file_age_hours = 0

[logging]
level = "info"
format = "json"
file = ""
rotation = { max_size_mb = 10, max_files = 30, daily = true }

[security]
hmac_key = ""