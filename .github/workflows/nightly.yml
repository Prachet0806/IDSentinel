name: Nightly

on:
  schedule:
    - cron: '0 2 * * *'  # 2 AM UTC daily
  workflow_dispatch:

permissions:
  contents: read

jobs:
  strict-analysis:
    runs-on: ubuntu-24.04
    # NOTE: the `runner` context is not available in job-level `env`
    # (GitHub rejects it at parse time), so paths here use `github.workspace`.
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/vcpkg-binary-cache,readwrite"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: '${{ github.workspace }}/vcpkg'
          vcpkgGitCommitId: '58845ed63eb19aff55e896ea1f5d51f2a0df5b66'
          vcpkgArguments: 'install --feature-flags=manifests'
          appendedCacheArgs: '--binarysource=clear;files,${{ github.workspace }}/vcpkg-binary-cache,readwrite'

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DCMAKE_TOOLCHAIN_FILE=${{ env.VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Install static analysis tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy-18 clang-tools-18 cppcheck

      - name: Run clang-tidy (strict)
        run: |
          run-clang-tidy-18 -p build -j "$(nproc)" -header-filter='src/.*' -quiet -warnings-as-errors='*' 'src/.*\.cpp$'

      - name: Run cppcheck (strict)
        run: |
          cppcheck --enable=warning,performance,portability --error-exitcode=1 --inline-suppr --suppress=missingIncludeSystem --suppress=unusedFunction src/

      - name: Install coverage tools
        run: pip install gcovr

      - name: Run tests with coverage
        run: |
          cmake -S . -B build_coverage -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="--coverage" -DBUILD_TESTING=ON -DCMAKE_TOOLCHAIN_FILE=${{ env.VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake
          cmake --build build_coverage --config Debug --parallel
          ctest --test-dir build_coverage --output-on-failure
          gcovr --root . --filter 'src/.*' --exclude 'tests/.*' --print-summary

  dependency-check:
    runs-on: ubuntu-24.04
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: '${{ github.workspace }}/vcpkg'
          vcpkgGitCommitId: '58845ed63eb19aff55e896ea1f5d51f2a0df5b66'
          vcpkgArguments: 'install --feature-flags=manifests'

      - name: Check for outdated packages
        run: |
          cd ${{ github.workspace }}/vcpkg
          ./vcpkg outdated
