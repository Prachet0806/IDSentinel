name: CI

on:
  push:
    branches: [main, upgrade]
  pull_request:
    branches: [main, upgrade]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    # NOTE: the `runner` context is not available in job-level `env`
    # (GitHub rejects it at parse time), so paths here use `github.workspace`.
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
        build_type: [Release, Debug]
        include:
          - os: ubuntu-24.04
            vcpkg_triplet: x64-linux
          - os: windows-latest
            vcpkg_triplet: x64-windows
          - os: macos-latest
            vcpkg_triplet: arm64-osx

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: '${{ github.workspace }}/vcpkg'
          vcpkgGitCommitId: '58845ed63eb19aff55e896ea1f5d51f2a0df5b66'
          vcpkgArguments: 'install --feature-flags=manifests'
          appendedCacheArgs: '--binarysource=clear;files,${{ github.workspace }}/vcpkg-binary-cache,readwrite'

      - name: Configure CMake (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $toolchain = Join-Path $env:VCPKG_ROOT "scripts/buildsystems/vcpkg.cmake"
          Write-Host "VCPKG_ROOT=$env:VCPKG_ROOT"
          Write-Host "Toolchain=$toolchain"
          cmake --version
          if (-not (Test-Path -LiteralPath $toolchain)) {
            throw "vcpkg toolchain not found: $toolchain"
          }

          cmake -S . -B build `
            "-DVCPKG_TARGET_TRIPLET=${{ matrix.vcpkg_triplet }}" `
            -DBUILD_TESTING=ON `
            "-DCMAKE_TOOLCHAIN_FILE=$toolchain"

      - name: Configure CMake (Unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DVCPKG_TARGET_TRIPLET=${{ matrix.vcpkg_triplet }} \
            -DBUILD_TESTING=ON \
            -DCMAKE_TOOLCHAIN_FILE=${{ env.VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }} --parallel

      - name: Install static analysis tools
        if: matrix.os == 'ubuntu-24.04' && matrix.build_type == 'Release'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang-18 \
            clang-tidy-18 \
            clang-tools-18 \
            cppcheck

      - name: Verify static analysis tools
        if: matrix.os == 'ubuntu-24.04' && matrix.build_type == 'Release'
        run: |
          clang-18 --version
          clang-tidy-18 --version
          command -v run-clang-tidy-18 || command -v run-clang-tidy || ls /usr/lib/llvm-18/share/clang/run-clang-tidy.py
          cppcheck --version

      - name: Run clang-tidy
        if: matrix.os == 'ubuntu-24.04' && matrix.build_type == 'Release'
        run: |
          TIDY_RUNNER="$(command -v run-clang-tidy-18 || command -v run-clang-tidy || echo /usr/lib/llvm-18/share/clang/run-clang-tidy.py)"
          echo "Using tidy runner: $TIDY_RUNNER"
          test -f build/compile_commands.json
          "$TIDY_RUNNER" -p build -j "$(nproc)" -header-filter='src/.*' -quiet -warnings-as-errors='*'

      - name: Run cppcheck
        if: matrix.os == 'ubuntu-24.04' && matrix.build_type == 'Release'
        run: |
          cppcheck --enable=warning,performance,portability --error-exitcode=1 --inline-suppr --suppress=missingIncludeSystem --suppress=unusedFunction src/

      - name: Run tests (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          ctest `
            --test-dir build `
            -C "${{ matrix.build_type }}" `
            --output-on-failure `
            --parallel 4

      - name: Run tests (Unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          ctest \
            --test-dir build \
            -C "${{ matrix.build_type }}" \
            --output-on-failure \
            --parallel 4
